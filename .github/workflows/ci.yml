# Builds the library, nntest and the Python package on amd64, runs every
# test (C++ unit tests, quick experiments, pytest), and builds two Debian
# packages for Ubuntu 24.04: libexrelaxer-dev and python3-exrelaxer
# (packaging/build-debs.sh). The packages are installed and smoke-tested,
# then uploaded as the run's artifact; a v* tag also attaches them to a
# GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the package version names the commit date and hash

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev file \
            python3-dev python3-numpy python3-pytest python3-pip
          # nanobind is not packaged for Ubuntu 24.04; it is only needed to build.
          /usr/bin/python3 -m pip install --user --break-system-packages "nanobind>=2.0"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DEXRELAXER_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

      - name: Build Debian packages
        run: |
          # A v1.2.3 tag gives version 1.2.3; other builds 1.0.0+git<date>.<hash>.
          version=""
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          packaging/build-debs.sh build dist $version

      - name: Install and smoke-test the packages
        run: |
          sudo apt-get install -y ./dist/*.deb
          cd "$RUNNER_TEMP"
          /usr/bin/python3 -I -c "import exrelaxer as exr; print('exrelaxer', exr.constants.recovery_factor)"
          nntest list > /dev/null
          cmake -S "$GITHUB_WORKSPACE/examples/consumer" -B consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer
          ./consumer/exrelaxer_example

      - uses: actions/upload-artifact@v5
        with:
          name: debs-amd64
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: debs-amd64
          path: dist
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on github.com (which also pushes the tag) already
          # exists: add the packages to it. Otherwise create one.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
