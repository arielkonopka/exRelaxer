engthAdjust="spacingAndGlyphs" textLength="181" x="67" y="682.1891">record Edge{A, B, Feedback, n}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="183" x="67" y="699.8951">and BuildOp{Feedback, A, B, n}</text><path d="M703,731.7041 L703,794.7041 L995,794.7041 L995,741.7041 L985,731.7041 L703,731.7041 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M985,731.7041 L985,741.7041 L995,741.7041 L985,731.7041 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="271" x="709" y="750.6011">if C's growth also added neurons somewhere,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="249" x="709" y="768.3071">its own listeners would be notified in turn:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="179" x="709" y="786.0131">growth cascades downstream</text><!--MD5=[be387cab60bd6229a79a881356c738b2]
@startuml sequence_growth
skinparam shadowing false
skinparam sequenceMessageAlign left
autonumber

title Feedback growth and propagation: net.addFeedback(A, B, n) when C already reads B

participant network
participant "A : dense" as A
participant "B : dense" as B
participant "C : dense" as C
participant "neuron (in C)" as CN

note over B, C : earlier: net.connect(B, C)\n-> C has a group sourced from B,\nC is in B.listeners

network -> A : addFeedback(B, n)
A -> B : addNeuronsWithGroup(n, A.getOutput(), A)
B -> B : create n neurons (same E-R/habituation flags)\ninitializeWeights: one weight per A output
B -> B : new WiringGroup {inputs = A's slots,\nnew neuron indices, source = A}
B -> A : A.listeners += B  (if not already)
B -> B : append the n new output slots

loop each listener of B
  B -> C : notifySourceGrew(B, n new slots)
  loop each group of C whose source is B
    C -> C : group.inputs += new slots
    loop each neuron of that group
      C -> CN : growWeights(n)
    end
  end
end

A - -> network : true
network -> network : record Edge{A, B, Feedback, n}\nand BuildOp{Feedback, A, B, n}

note over C
  if C's growth also added neurons somewhere,
  its own listeners would be notified in turn:
  growth cascades downstream
end note

@enduml

